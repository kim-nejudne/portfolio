# buzzr.kimnejudne.dev
# Installed at /etc/nginx/sites-available/buzzr (README, Deploy).
#
# Everything goes to the one Node container on loopback 3005: the built client, the HTTP API,
# uploaded images and the Socket.IO WebSocket. Node serves the client itself, so there is no
# bundle on disk here and no route list to keep in step with the React router.

# `Connection: upgrade` only when the client asked for one; plain requests keep keep-alive.
map $http_upgrade $buzzr_connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    # The droplet runs nginx 1.24, which predates the separate `http2 on;` directive.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name buzzr.kimnejudne.dev;

    ssl_certificate /etc/letsencrypt/live/buzzr.kimnejudne.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/buzzr.kimnejudne.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Own log, so this host can be read apart from the other vhosts.
    access_log /var/log/nginx/buzzr.access.log;

    # Room creation sends the set as JSON (up to 1 MB) and each image upload is up to 1.5 MB.
    # nginx's default of 1 MB would refuse both before Node sees them.
    client_max_body_size 2m;

    # Every player, Screen and Host holds one WebSocket here for the whole game.
    # The upgrade headers are what let it through; without them Socket.IO cannot connect at all,
    # because the gateway accepts the WebSocket transport only. Socket.IO pings every 25 s,
    # so a 120 s read timeout never closes a live socket but does reap a dead one.
    location ^~ /socket.io/ {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $buzzr_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # TRUST_PROXY=1 takes the right-most entry, which is the one nginx appends.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}

server {
    listen 80;
    listen [::]:80;
    server_name buzzr.kimnejudne.dev;

    # Renewal is webroot-based against this directory. Keep it reachable over plain HTTP.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
