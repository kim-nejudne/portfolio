# Local development stack. The droplet stack lives in deploy/ and is built
# separately — see the deployment runbook.
#
# Postgres is published on 5434: 5432 is the system default and 5433 is already
# taken by another project on this workstation. Nothing here may assume a free
# port, which is also why the deployed stack publishes nothing at all.

name: forme

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: forme
      POSTGRES_PASSWORD: forme
      POSTGRES_DB: forme
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - forme-db:/var/lib/postgresql/data
    command:
      - postgres
      # Tuned for a shared 1.9GB box rather than left at defaults, so the
      # development stack behaves like the deployed one.
      - -c
      - shared_buffers=32MB
      - -c
      - effective_cache_size=96MB
      - -c
      - work_mem=2MB
      - -c
      - max_connections=20
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forme -d forme"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    mem_limit: 192m

volumes:
  forme-db:
