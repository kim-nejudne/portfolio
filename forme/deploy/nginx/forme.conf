# /etc/nginx/sites-available/forme  ->  forme.kimnejudne.dev
#
# Install this BEFORE running certbot. Certbot needs a working port-80 vhost to
# answer the HTTP-01 challenge, and it rewrites this file in place to add the
# TLS block — leave its managed lines alone afterwards.

server {
    listen 80;
    listen [::]:80;
    server_name forme.kimnejudne.dev;

    # Artwork uploads are capped at 200MB in the API. nginx defaults to 1MB and
    # would reject a real PDF with its own 413 long before the API ever saw the
    # file — so the two limits have to agree.
    client_max_body_size 200M;

    # A 200MB upload over a slow connection takes a while; the defaults (60s)
    # would cut it off mid-transfer.
    client_body_timeout 300s;

    # The socket.io endpoint. Needs the upgrade headers, and a read timeout
    # longer than the heartbeat or the connection is dropped every 60s and the
    # floor board silently stops updating.
    location /api/events {
        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # Buffering breaks a long-lived stream.
        proxy_buffering off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The API sets `trust proxy 1` and keys its sign-in rate limiter on the
        # result. Without this header every client looks like 127.0.0.1 and the
        # limiter becomes one shared bucket for the whole internet.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next emits content-hashed filenames under this path, so they are safe to
    # cache hard and pointless to revalidate.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3005;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
