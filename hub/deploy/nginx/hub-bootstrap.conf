# kimnejudne.dev — bootstrap vhost, HTTP only.
#
# This exists to solve a chicken-and-egg: `hub.conf` references
# /etc/letsencrypt/live/kimnejudne.dev/, so `nginx -t` fails and nginx will not
# reload until the certificate exists — and certbot cannot issue the certificate
# until nginx is answering on port 80 for that name.
#
# So this goes in first, serves the site over plain HTTP and keeps the ACME
# challenge path reachable, and is replaced by `hub.conf` once the certificate
# is in hand. It is not the shipped configuration and should never be left
# installed: no TLS, no redirect, no security headers.
#
#   ssh root@165.245.189.5 'ln -sf /etc/nginx/sites-available/hub /etc/nginx/sites-enabled/hub && nginx -t && systemctl reload nginx'
#   certbot certonly --webroot -w /var/www/certbot -d kimnejudne.dev -d www.kimnejudne.dev
#   # then install hub.conf over it and reload

server {
    listen 80;
    listen [::]:80;
    server_name kimnejudne.dev www.kimnejudne.dev;

    root /var/www/hub;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
