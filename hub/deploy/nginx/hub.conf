# kimnejudne.dev — the hub, and the apex.
#
# Lives at /etc/nginx/sites-available/hub, symlinked into sites-enabled.
# TLS blocks are certbot-managed — leave those lines as they are.
#
# This file is a copy of what is installed, pulled back from the droplet after
# the last change so the two cannot drift. `deploy.sh` does not touch it; it only
# reloads.
#
# The hub is a pure static Vite build with no server process, so nginx serves the
# files from disk. No container: putting one on this box to hand out 8MB of
# static assets would cost memory for nothing, and the box has five other sites
# and two co-tenants in 1.9GB.
#
# NOTE ON add_header: nginx does NOT merge add_header across levels — a location
# block containing any add_header discards every one inherited from the server
# block. The security headers are therefore repeated in each location rather
# than set once at server level, which would silently do nothing.

server {
    server_name kimnejudne.dev;

    root /var/www/hub;
    index index.html;

    # Renewal is webroot-based against this directory. Keep it reachable.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Vite emits content-hashed filenames under /assets/, so these are immutable.
    location /assets/ {
        try_files $uri =404;
        access_log off;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # The drawing and the five spoke crops. NOT content-hashed — they are in
    # `public/`, so their URLs are stable and the bytes may change when the art
    # is re-cut. A week is long enough to be worth having and short enough that
    # a re-cut lands without a cache-buster.
    #
    # 7MB of the 8.2MB build is the head. It is the whole reason this site is
    # heavy, and the reason `immutable` would be the wrong answer: the art has
    # been re-cut twice in two days.
    location ~* ^/(head|crops)/ {
        try_files $uri =404;
        access_log off;

        add_header Cache-Control "public, max-age=604800" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # The entry document is rewritten on every deploy and must not be cached, or
    # a stale index.html will keep pointing at deleted asset hashes.
    #
    # `=404`, NOT `/index.html`. The hub has no client-side router — it is one
    # page. An SPA fallback here would answer every unknown path with 200 and the
    # homepage as text/html, so /favicon.ico and /robots.txt would return the
    # document, no 404 would exist anywhere on the site, and a crawler could
    # index unlimited duplicate URLs of the portfolio's front door.
    #
    # This is not hypothetical for this site. `vite preview` *does* have that
    # fallback, and it is what made the preload check pass on a preload pointing
    # at a deleted layer — see `scripts/verify.mjs`.
    location / {
        try_files $uri $uri/ =404;

        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Assets are precompressed at deploy time with gzip -9; serve those rather
    # than burning the shared vCPU recompressing per request.
    gzip_static on;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 1m;

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/kimnejudne.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kimnejudne.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# www redirects to the apex rather than serving a second copy.
#
# The apex is canonical — `index.html` says so in its <link rel=canonical> and
# its og:url — and two hostnames serving identical bytes is a duplicate-content
# problem on the one page that most wants to rank for a person's name.
#
# It has to be a real server block with its own TLS, not a rewrite: a browser
# validates the certificate against the name it typed *before* any redirect is
# read, so `https://www.kimnejudne.dev` with no cert for `www` is a security
# warning, not a redirect. The certificate therefore covers both names.
server {
    server_name www.kimnejudne.dev;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://kimnejudne.dev$request_uri;
    }

    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/kimnejudne.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kimnejudne.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# Plain HTTP for both names: the ACME challenge stays reachable on port 80 (that
# is how renewal works), everything else goes to HTTPS.
server {
    server_name kimnejudne.dev www.kimnejudne.dev;

    listen 80;
    listen [::]:80;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://kimnejudne.dev$request_uri;
    }
}
