<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Name, title, pitch and both descriptions are `src/identity.ts`, which
         is the only place they are authored. This file cannot import it, so
         `scripts/identity-check.mjs` reads this one as text at `prebuild` and
         fails the build naming the line that has drifted. The separator is a
         middot rather than an em dash on purpose: see that module. -->
    <title>Kim Nejudne · Senior Full-Stack Engineer</title>
    <meta
      name="description"
      content="Senior full-stack engineer who ships whole products. Nine years of production JavaScript: TypeScript, React, NestJS, Postgres."
    />
    <link rel="canonical" href="https://kimnejudne.dev/" />
    <meta name="theme-color" content="#f7f4ec" />

    <!-- Icons and the share card sit at the site root, deliberately outside
         /assets/: that path is content-hashed and served `immutable` for a
         year, which would pin the first card any platform ever scraped.

         The SVG is the definition of the mark; the two PNGs are screenshots of
         it taken by `scripts/brand.sh`, so they cannot drift from it. The
         96px one is the fallback for browsers without SVG favicon support —
         `sizes` is what lets a browser skip it when it has taken the SVG. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-96.png" type="image/png" sizes="96x96" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- The closed head is the first paint, and the closed head is exactly these
         two: `face` below the tear and `lid` above it. `sky` is deliberately not
         here — it is behind them at opacity 0 until the head opens, so preloading
         it would fetch 80KB nobody can see on the critical path.

         This listed `head-back.avif` until the deploy, a layer deleted weeks
         earlier along with five others. It was a 404 on every page load, first
         in the list, spending a connection on the critical path to fetch
         nothing. Nothing noticed: 35 browser assertions pass either way, a
         failed preload is silent by design, and the page it holds up renders
         correctly regardless. -->
    <link rel="preload" as="image" href="/head/face.avif" type="image/avif" />
    <link rel="preload" as="image" href="/head/lid.avif" type="image/avif" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kim Nejudne" />
    <meta property="og:url" content="https://kimnejudne.dev/" />
    <meta property="og:title" content="Kim Nejudne · Senior Full-Stack Engineer" />
    <meta
      property="og:description"
      content="Senior full-stack engineer who ships whole products. Five standalone products, each with its own art direction."
    />

    <!-- Absolute, not root-relative: several scrapers resolve og:image against
         nothing at all and simply drop a relative one.

         The card is rendered from this site's own artwork and fonts by
         `scripts/brand.sh`: the head layers at the real hinge, the pitch
         verbatim from `src/identity.ts`. Rebuild it whenever either changes.

         "Nothing here will tell you it has gone stale" was true of the words
         until 2026-08-07 and is not any more. `scripts/identity-check.mjs`
         holds the card template to the same strings this file uses, so the two
         cannot disagree about the pitch. The *picture* is still on trust: a
         re-cut of the head silently leaves an old card in place. -->
    <meta property="og:image" content="https://kimnejudne.dev/og-card.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A pen-and-ink portrait of Kim, the top of his head hinged open onto a circle of sky. Beside it: senior full-stack engineer who ships whole products."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
