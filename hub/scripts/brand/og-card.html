<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>og:card source</title>
    <!--
      The share card, 1200x630, rendered by a real browser off the real fonts
      and the real artwork.

      Two things it deliberately does NOT do:

      1. It does not mock up the head. The layers are `public/head/*.png`, the
         hinge is `HINGE` from `src/head.ts`, and the swing is `LID_ANGLE` from
         `src/choreography.ts`. A card drawn to *resemble* the page goes stale
         the next time the art is re-cut and nothing tells you — and this art
         has been re-cut twice in two days.

      2. It does not restate the pitch in its own words. The type is verbatim
         from `src/components/Pitch.tsx`, because the card is the argument and
         there should be exactly one copy of the argument.

      Paths are absolute from the *repo* root, not the site root: brand.sh
      serves `hub/`, so the artwork is at /public/head/... here and at /head/...
      once built. Only this file has to know that.
    -->
    <style>
      @font-face {
        font-family: 'Bodoni Moda';
        font-weight: 400 900;
        src: url('/src/fonts/bodoni-moda-latin-wght-normal.woff2') format('woff2-variations');
      }
      @font-face {
        font-family: 'IBM Plex Mono';
        font-weight: 400;
        src: url('/src/fonts/ibm-plex-mono-latin-400-normal.woff2') format('woff2');
      }

      :root {
        --paper: #f7f4ec;
        --ink: #16181d;
        --muted: #6f727a;
        --rule: #d9d4c8;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--paper);
        color: var(--ink);
        position: relative;
        -webkit-font-smoothing: antialiased;
      }

      /*
        The head, cropped by the card.

        `.canvas` is the 1200x1600 artboard exactly, as it is in the app, so
        every layer sits at `inset: 0` and registration is inherited from
        `compose-art.py` rather than re-established here.

        It is positioned by the crown rather than centred: the card wants the
        opening and the swung lid, and the shoulders are the part to lose.
      */
      /*
        Cropped at the beard, above the collar — which is not only a
        composition choice. The drawing's shirt has a green stripe, and it is
        live colour on a site whose one rule is paper and ink. The duotone
        treatment that would resolve it is unapplied (see ../../README.md), so
        until it lands the card frames above the collar rather than shipping
        the violation to every platform that scrapes it.
      */
      .canvas {
        position: absolute;
        width: 940px;
        height: 1253.33px;
        right: -92px;
        top: -236px;
      }
      .canvas img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }

      /* Behind everything. The one colour on this site that is not a project. */
      .sky { z-index: 1; }
      .face { z-index: 2; }
      /* The lid is in front of the face — it is the hair that swings off the
         top, and behind the face the tear renders as a line instead of an edge. */
      .lid-hinge {
        position: absolute;
        inset: 0;
        transform-origin: 82.222% 42.833%;   /* HINGE, src/head.ts */
        transform: rotate(165deg);           /* LID_ANGLE, src/choreography.ts */
        z-index: 3;
      }

      /*
        The type sits on a paper panel that fades out to the right rather than
        stopping at an edge. The lid swings a long way left at 165deg and the
        headline has to stay readable over whatever lands under it, without a
        hard-edged box that would read as a slide.
      */
      .pitch {
        position: absolute;
        z-index: 4;
        left: 68px;
        top: 0;
        bottom: 0;
        width: 700px;
        padding-right: 130px;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .pitch::before {
        content: '';
        position: absolute;
        inset: 0 0 0 -68px;
        background: linear-gradient(
          to right,
          var(--paper) 0%,
          var(--paper) 68%,
          transparent 100%
        );
        z-index: -1;
      }

      .mono { font-family: 'IBM Plex Mono', monospace; }

      .name {
        font-size: 15px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--muted);
      }

      .line {
        font-family: 'Bodoni Moda', Georgia, serif;
        font-weight: 500;
        font-size: 56px;
        line-height: 1.06;
        letter-spacing: -0.02em;
        margin-top: 22px;
      }

      .rule {
        width: 96px;
        height: 1px;
        background: var(--rule);
        margin-top: 30px;
      }

      .meta {
        font-size: 14px;
        line-height: 1.75;
        letter-spacing: 0.06em;
        color: var(--muted);
        margin-top: 26px;
      }
    </style>
  </head>
  <body>
    <div class="canvas">
      <img class="sky" src="/public/head/sky.png" alt="" />
      <img class="face" src="/public/head/face.png" alt="" />
      <div class="lid-hinge"><img src="/public/head/lid.png" alt="" /></div>
    </div>

    <div class="pitch">
      <p class="name mono">Kim Nejudne — Design Engineer</p>
      <h1 class="line">Full-stack engineer<br />with a designer&rsquo;s eye.</h1>
      <div class="rule"></div>
      <p class="meta mono">
        Nine years of production JavaScript<br />
        An editorial background<br />
        Motion that ships at 60fps
      </p>
    </div>
  </body>
</html>
