<!doctype html>
<html lang="en">
  <head>
    <!-- charset first and inside the first 1024 bytes, for the reason
         `page.html` gives at length: `deploy/nginx/hub.conf` sets no `charset`
         directive, so this tag is the only thing that says so. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Case Studies · Kim Nejudne</title>
    <meta name="description" content="{{DESCRIPTION}}" />
    <link rel="canonical" href="{{CANONICAL}}" />
    <meta name="theme-color" content="#f7f4ec" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-96.png" type="image/png" sizes="96x96" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- `website`, not `article`, and the hub's own card rather than a spoke's.
         This page is a table of contents for the five, so it belongs to the
         site the way the homepage does. The five pages below it each carry
         their own card, generated by `scripts/case-study-cards.mjs`. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kim Nejudne" />
    <meta property="og:url" content="{{CANONICAL}}" />
    <meta property="og:title" content="Case Studies · Kim Nejudne" />
    <meta property="og:description" content="{{DESCRIPTION}}" />
    <meta property="og:image" content="https://kimnejudne.dev/og-card.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="{{CARD_ALT}}" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="/src/case-study.css" />
  </head>
  <body class="cs">
    <a class="skip mono" href="#work">Skip to the case studies</a>

    <header class="cs-mast mono">
      <a class="cs-mast-name" href="/">Kim Nejudne</a>
      <!-- "Home", where the five pages say "All work". On those, "all work"
           means the list you are not currently looking at; here it would name
           this page and point away from it. -->
      <a class="cs-mast-back" href="/">&larr; Home</a>
    </header>

    <main id="work">
      <div class="cs-body">
        <h1>Case Studies</h1>
        <p class="cs-lede">{{DESCRIPTION}}</p>
      </div>

      <!-- The same `.cs-others-*` list the case-study pages carry at their
           feet, with every row rather than all but one. Reused rather than restyled: this page and
           that footer are the same object seen from two places, and a second
           set of classes would be two things to keep looking alike. -->
      <nav class="cs-index" aria-labelledby="cs-index-heading">
        <h2 class="cs-others-heading mono" id="cs-index-heading">All three</h2>
        <ol class="cs-others-list">
{{ROWS}}
        </ol>
      </nav>
    </main>

    <footer class="cs-foot">
      <p class="cs-colophon mono"><a href="/">kimnejudne.dev</a></p>
    </footer>
  </body>
</html>
