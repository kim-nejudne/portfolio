<!doctype html>
<html lang="en">
  <head>
    <!-- charset first, and inside the first 1024 bytes, because nothing else
         will say so. `deploy/nginx/hub.conf` sets no `charset` directive, so
         the document arrives as `text/html` with no charset parameter and the
         browser has only this tag to go on. These five files are full of em
         dashes, middots, Σ, × and the é in PokéTrack; get this wrong and every
         one of them renders as mojibake on a page about craft. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{TITLE}}</title>
    <meta name="description" content="{{DESCRIPTION}}" />
    <link rel="canonical" href="{{CANONICAL}}" />
    <meta name="theme-color" content="#f7f4ec" />

    <!-- Root-relative, so they resolve from /work/<spoke>/ unchanged. Same
         three the homepage uses; see `index.html` for why they sit outside
         /assets/. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-96.png" type="image/png" sizes="96x96" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="article" />
    <meta property="og:site_name" content="Kim Nejudne" />
    <meta property="og:url" content="{{CANONICAL}}" />
    <meta property="og:title" content="{{TITLE}}" />
    <meta property="og:description" content="{{DESCRIPTION}}" />

    <!-- The hub's card, shared by all five. A per-spoke card is the obvious
         upgrade and belongs in `scripts/brand.sh` when it happens — note that
         the crops in `public/crops/` are 900x600 and this slot is 1200x630, so
         a crop cannot simply be dropped in, and `verify.mjs` decodes the image
         and compares its real pixels against these two numbers. -->
    <meta property="og:image" content="https://kimnejudne.dev/og-card.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A pen-and-ink portrait of Kim, the top of his head hinged open onto a circle of sky. Beside it: full-stack engineer with a designer's eye."
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="/src/case-study.css" />
  </head>
  <body class="cs">
    <a class="skip mono" href="#case-study">Skip to the case study</a>

    <header class="cs-mast mono">
      <a class="cs-mast-name" href="/">Kim Nejudne</a>
      <a class="cs-mast-back" href="/#work">&larr; All work</a>
    </header>

    <main id="case-study">
      <article class="cs-body">
{{BODY}}
      </article>
    </main>

    <footer class="cs-foot">
      <p class="cs-live mono">
        <span class="cs-live-label">Live at</span>
        <a href="{{HREF}}">{{HOST}}</a>
      </p>

      <nav class="cs-others" aria-labelledby="cs-others-heading">
        <h2 class="cs-others-heading mono" id="cs-others-heading">The other four</h2>
        <ol class="cs-others-list">
{{OTHERS}}
        </ol>
      </nav>

      <p class="cs-colophon mono"><a href="/">kimnejudne.dev</a></p>
    </footer>
  </body>
</html>
