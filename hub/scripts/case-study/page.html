<!doctype html>
<html lang="en">
  <head>
    <!-- charset first, and inside the first 1024 bytes, because nothing else
         will say so. `deploy/nginx/hub.conf` sets no `charset` directive, so
         the document arrives as `text/html` with no charset parameter and the
         browser has only this tag to go on. These five files are full of em
         dashes, middots, Σ, × and the é in PokéTrack; get this wrong and every
         one of them renders as mojibake on a page about craft. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{TITLE}}</title>
    <meta name="description" content="{{DESCRIPTION}}" />
    <link rel="canonical" href="{{CANONICAL}}" />
    <meta name="theme-color" content="#f7f4ec" />

    <!-- Root-relative, so they resolve from /work/<spoke>/ unchanged. Same
         three the homepage uses; see `index.html` for why they sit outside
         /assets/. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-96.png" type="image/png" sizes="96x96" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta property="og:type" content="article" />
    <meta property="og:site_name" content="Kim Nejudne" />
    <meta property="og:url" content="{{CANONICAL}}" />
    <meta property="og:title" content="{{TITLE}}" />
    <meta property="og:description" content="{{DESCRIPTION}}" />

    <!-- This spoke's own card, generated by `scripts/case-study-cards.mjs`.
         All five pages shared the hub's until 2026-08-07, so a link to the
         FORME write-up and a link to the SUKI write-up previewed as the same
         picture of Kim's head — five arguments, one image.

         In the hub's frame rather than the spoke's, deliberately: these pages
         live here because five write-ups in five art directions would read as
         five more spokes, where five in one paper-and-ink frame reads as a
         curator. A card borrowed from the spoke would undo that. The crop is
         the only colour on it, which is the one colour rule's own exception.

         Same-origin is not optional — `verify.mjs` requires og:image to sit on
         the canonical origin, so pointing this at the spoke's subdomain was
         never available. The crops in `public/crops/` are 900x600 and this slot
         is 1200x630; the generator composes rather than rescaling, and
         `verify.mjs` decodes the image and checks its real pixels. -->
    <meta property="og:image" content="https://kimnejudne.dev/cards/{{ID}}.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="{{CARD_ALT}}" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="stylesheet" href="/src/case-study.css" />
  </head>
  <body class="cs">
    <a class="skip mono" href="#case-study">Skip to the case study</a>

    <header class="cs-mast mono">
      <a class="cs-mast-name" href="/">Kim Nejudne</a>
      <a class="cs-mast-back" href="/#work">&larr; All work</a>
    </header>

    <main id="case-study">
      <article class="cs-body">
{{BODY}}
      </article>
    </main>

    <footer class="cs-foot">
      <!-- Two links, one row. The live site is what the case study describes;
           the repository is the claim underneath it. They belong together at
           the foot of the argument rather than in the masthead, because a
           reader who has finished the piece is the one with a reason to open
           either. `rel="noopener"` matches what `render.mjs` puts on every
           external link inside the prose. -->
      <p class="cs-live mono">
        <span class="cs-live-pair">
          <span class="cs-live-label">Live at</span>
          <a href="{{HREF}}">{{HOST}}</a>
          <span class="cs-live-sep" aria-hidden="true">·</span>
        </span>
        <span class="cs-live-pair">
          <span class="cs-live-label">Source</span>
          <a href="{{REPO}}" rel="noopener">{{REPO_LABEL}}</a>
        </span>
      </p>

      <nav class="cs-others" aria-labelledby="cs-others-heading">
        <h2 class="cs-others-heading mono" id="cs-others-heading">The other four</h2>
        <ol class="cs-others-list">
{{OTHERS}}
        </ol>
      </nav>

      <p class="cs-colophon mono"><a href="/">kimnejudne.dev</a></p>
    </footer>
  </body>
</html>
