# Droplet stack for pinpoint.kimnejudne.dev. Lives at /opt/pinpoint/compose.yaml beside a .env that holds
# IMAGE_TAG and the app's real secrets (only there and in GitHub secrets; never in git).
#
# The image is built off the droplet and shipped with `docker save | docker load`, so there is no
# build context here. scripts/docker-smoke.sh reads the port binding, mem_limit and the literal
# environment values from this file, so a dropped key fails the smoke test.
#
#   docker compose up -d

name: pinpoint

services:
  app:
    image: pinpoint:${IMAGE_TAG:-local}
    restart: unless-stopped
    env_file: .env
    environment:
      # nginx on the host is the one proxy hop; per-IP limits need the client's address.
      TRUST_PROXY: '1'
      # Caps V8's heap under mem_limit, so it collects before the container is killed.
      NODE_OPTIONS: '--max-old-space-size=192'
      DATA_DIR: '/data'
    # The database lives on the host so a new image keeps it; backed up nightly (README, Backups).
    volumes:
      - /opt/pinpoint/data:/data
    # Loopback only: nginx terminates TLS in front and is the sole way in.
    ports:
      - '127.0.0.1:3009:3000'
    # Set by F59 from a measured peak plus headroom; it must fit the droplet's free memory.
    mem_limit: 320m
