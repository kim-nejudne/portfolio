# pinpoint.kimnejudne.dev — bootstrap vhost, HTTP only, installed during prep before the certificate exists.
#
# pinpoint.conf names /etc/letsencrypt/live/pinpoint.kimnejudne.dev/, so `nginx -t` fails until the certificate
# exists, and certbot cannot issue it until nginx answers on port 80 for the name. This goes in
# first, keeps the ACME challenge path reachable, and is replaced by pinpoint.conf once the
# certificate is in hand. Never leave it installed: no TLS, no app.

server {
    listen 80;
    listen [::]:80;
    server_name pinpoint.kimnejudne.dev;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 404;
    }
}
