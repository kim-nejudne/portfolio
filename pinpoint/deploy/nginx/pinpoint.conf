# pinpoint.kimnejudne.dev
# Installed at /etc/nginx/sites-available/pinpoint during prep (bootstrap-autopilot).
#
# Everything goes to the one container on loopback 3009. Until the first deploy answers, nginx
# serves the placeholder page with a 503, so the live URL shows
# something and a health check can't mistake it for the app.

# `Connection: upgrade` only when the client asked for one; plain requests keep keep-alive.
map $http_upgrade $pinpoint_connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    # The droplet's nginx predates the separate `http2 on;` directive.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pinpoint.kimnejudne.dev;

    ssl_certificate /etc/letsencrypt/live/pinpoint.kimnejudne.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pinpoint.kimnejudne.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/pinpoint.access.log;

    client_max_body_size 1m;

    # No upstream keepalive: the deploy counts established connections to 127.0.0.1:3009 as
    # live clients. WebSocket upgrade is harmless for apps that never ask for one.
    location / {
        proxy_pass http://127.0.0.1:3009;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $pinpoint_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # TRUST_PROXY=1 takes the right-most entry, which is the one nginx appends.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_intercept_errors off;
        error_page 502 504 =503 /__placeholder.html;
    }

    # Shown only while the container is down (before the first deploy, or mid-restart). The
    # file is deploy/placeholder/index.html, installed as
    # /var/www/pinpoint-placeholder/__placeholder.html.
    location = /__placeholder.html {
        internal;
        root /var/www/pinpoint-placeholder;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "120" always;
    }

    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}

server {
    listen 80;
    listen [::]:80;
    server_name pinpoint.kimnejudne.dev;

    # Renewal is webroot-based against this directory. Keep it reachable over plain HTTP.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
