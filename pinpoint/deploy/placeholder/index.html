<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pinpoint · coming soon</title>
<style>
  :root { color-scheme: light dark; --bg: #f7f5f0; --text: #1d1b22; --muted: #5d5966; }
  @media (prefers-color-scheme: dark) { :root { --bg: #16151a; --text: #f2f0ec; --muted: #a8a3b0; } }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: var(--bg); color: var(--text);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 0 16px; }
  main { max-width: 32rem; text-align: center; }
  h1 { font-size: clamp(1.75rem, 6vw, 2.5rem); margin: 0 0 .5rem; letter-spacing: -0.01em; }
  p { margin: 0; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Pinpoint</h1>
  <p>A geography party game: the TV shows a city or a landmark photo, everyone drops a pin on their phone's map, and the closest pin wins.</p>
  <p style="margin-top:1rem">Being built. Check back soon.</p>
</main>
</body>
</html>
