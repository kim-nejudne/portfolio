# Pinpoint's jobs for the monorepo's root .github/workflows/ci.yml. F01 pastes the two jobs
# below under that file's `jobs:` (after the other apps' jobs) and changes nothing else in it.
# The repo has one CI workflow, so this app gets a diff gate of its own: a push that does not
# touch pinpoint/ skips the build job.

  # Whether this push or pull request touches pinpoint/.
  pinpoint-changes:
    name: pinpoint changed?
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the base commit, to diff against

      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$EVENT" = workflow_dispatch ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            changed=true
          elif git diff --quiet "$BASE" HEAD -- pinpoint .github/workflows/ci.yml; then
            changed=false
          else
            changed=true
          fi
          echo "changed=$changed"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  # Pinpoint's checks (format, lint, typecheck, test, build), as the verify skill runs them.
  pinpoint:
    name: build pinpoint
    needs: pinpoint-changes
    if: ${{ needs.pinpoint-changes.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pinpoint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: pinpoint/package-lock.json
      - name: install
        run: npm ci
      - name: format
        run: npm run format:check
      - name: lint
        run: npm run lint
      - name: typecheck
        run: npm run typecheck
      - name: test
        run: npm test
      - name: build
        run: npm run build
