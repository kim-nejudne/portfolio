# /etc/nginx/sites-available/plinth
#
# PLINTH is one static page with no client-side router, so there is nothing here
# that needs a SPA fallback — and the fallback that was here actively hurt:
# `try_files $uri /index.html` answered EVERY unknown path with 200 and the
# homepage. /favicon.ico, /og-card.png and /robots.txt all returned text/html
# 200 before this file existed, and a crawler could index unlimited duplicate
# URLs. `=404` is the whole fix.
#
# The certbot lines (ssl_certificate, include options-ssl-nginx.conf, the
# ssl_dhparam) are managed by certbot --nginx; leave them where certbot put them
# rather than hand-editing.

server {
    listen 80;
    listen [::]:80;
    server_name plinth.kimnejudne.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name plinth.kimnejudne.dev;

    root /var/www/plinth;
    index index.html;

    # deploy.sh precompresses with gzip -9 so the single shared vCPU is not
    # recompressing the same 122KB bundle for every visitor.
    gzip_static on;

    # Browsers refuse to parse a manifest served as application/octet-stream,
    # which is what the stock mime.types does with this extension.
    types {
        application/manifest+json  webmanifest;
    }

    # nginx does NOT merge add_header across levels: any location block with an
    # add_header of its own discards every header inherited from the server
    # block. They are therefore repeated per location rather than set once here,
    # where they would silently apply to nothing.

    location / {
        try_files $uri $uri/ =404;

        # The document is rewritten every deploy and references content-hashed
        # asset URLs; a cached copy would point at hashes that no longer exist.
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Vite content-hashes everything under /assets/, so these are safe to pin
    # for a year. The share card and icons deliberately do NOT live here.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Root-level brand assets are not hashed — platforms cache the share card by
    # URL and re-scrape it, so the URL has to stay put while the bytes may
    # change. A day is long enough to be cheap and short enough to update.
    location ~* ^/(og-card\.png|favicon\.svg|apple-touch-icon\.png|icon-\d+\.png|site\.webmanifest)$ {
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
