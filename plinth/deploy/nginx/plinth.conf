# plinth.kimnejudne.dev
# Lives at /etc/nginx/sites-available/plinth, symlinked into sites-enabled.
# TLS blocks are certbot-managed — leave those lines as they are.
#
# Unlike tallow, PLINTH is a pure static build with no server process, so nginx
# serves the files directly from disk. No container: putting one on this box
# just to hand out 400KB of static assets would cost memory for nothing.
#
# NOTE ON add_header: nginx does NOT merge add_header across levels — a location
# block containing any add_header discards every one inherited from the server
# block. The security headers are therefore repeated in each location rather
# than set once at server level, which would silently do nothing.

server {
    server_name plinth.kimnejudne.dev;

    root /var/www/plinth;
    index index.html;

    # Renewal is webroot-based against this directory. Keep it reachable.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Vite emits content-hashed filenames under /assets/, so these are immutable.
    location /assets/ {
        try_files $uri =404;
        access_log off;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # nginx's default mime.types has no entry for .webmanifest, so it falls back
    # to application/octet-stream - which browsers refuse to parse as a manifest.
    location = /site.webmanifest {
        types { } default_type application/manifest+json;

        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Root-level brand assets are NOT content-hashed: platforms cache a share
    # card by URL and re-scrape it, so the URL has to stay put while the bytes
    # may change. A day is cheap and still lets a new card land.
    location ~* ^/(og-card\.png|favicon\.svg|apple-touch-icon\.png|icon-\d+\.png)$ {
        access_log off;

        add_header Cache-Control "public, max-age=86400" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # The entry document is rewritten on every deploy and must not be cached, or
    # a stale index.html will keep pointing at deleted asset hashes.
    #
    # `=404`, NOT `/index.html`. PLINTH has no client-side router, so the SPA
    # fallback that was here answered every unknown path with 200 and the
    # homepage as text/html — /favicon.ico, /og-card.png and /robots.txt all
    # returned the document, no 404 existed anywhere on the site, and a crawler
    # could index unlimited duplicate URLs.
    location / {
        try_files $uri $uri/ =404;

        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Assets are precompressed at deploy time with gzip -9; serve those rather
    # than burning the single vCPU recompressing per request.
    gzip_static on;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 1m;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/plinth.kimnejudne.dev/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/plinth.kimnejudne.dev/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}


server {
    if ($host = plinth.kimnejudne.dev) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name plinth.kimnejudne.dev;

    listen 80;
    listen [::]:80;
    return 404; # managed by Certbot


}