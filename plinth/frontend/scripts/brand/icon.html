<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PLINTH — icon source</title>
    <style>
      * { margin: 0; padding: 0; }
      html, body { width: 512px; height: 512px; }
      body { background: #101010; }
      /* Same geometry as favicon.svg, scaled 16x from its 32px grid. */
      .bar { position: absolute; left: 80px; }
      .volume { top: 160px; width: 352px; height: 80px; background: #1f2bff; }
      .intensity { top: 288px; width: 176px; height: 80px; background: #ff3b14; }
    </style>
  </head>
  <body>
    <div class="bar volume"></div>
    <div class="bar intensity"></div>
  </body>
</html>
