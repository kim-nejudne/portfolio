[pytest]
# The scaffold shipped a block of instructions addressed to its own build agent
# here, plus a hard requirement on pytest-xdist with two fixed workers. This is
# a small suite of pure functions; the worker startup cost exceeded the saving,
# and the agent instructions were never ours to follow.
#
# `pythonpath` matters: poc/test_core.py imports pokeapi_client from its own
# directory, so collecting it from backend/ used to fail outright. The old
# config never surfaced that because it never successfully collected it either.
testpaths = .
python_files = test_*.py
pythonpath = . poc
