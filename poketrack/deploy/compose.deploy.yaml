# Droplet stack. Lives at /opt/poketrack/compose.yaml alongside a .env holding
# secrets (see .env.production.example).
#
# The image is built on a workstation and shipped with `docker save | docker load`,
# so there is no build context here — the shared box should not be running pip.
#
#   docker compose up -d
#
# PokéTrack shares a 1.9GB box with n8n, tallow and netint-vpuaas. Every service
# is capped so a leak here cannot take the others down.

name: poketrack

services:
  db:
    image: mongo:7
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    # Deliberately no `ports:`. Mongo is reachable only on the private compose
    # network — it has no path to the internet at all.
    volumes:
      - poketrack-mongo:/data/db
    # WiredTiger otherwise sizes its cache at ~50% of host RAM, which on this
    # box is ~450MB and would crowd out n8n. The working set is a few MB of
    # tickets plus the PokéAPI cache, so 256MB is generous.
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: 384m

  app:
    image: poketrack:${IMAGE_TAG:-local}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # authSource=admin because the credentials are the root user created by
      # MONGO_INITDB_ROOT_*, which lives in the admin database, not poketrack.
      MONGO_URL: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@db:27017/?authSource=admin
      DB_NAME: ${DB_NAME:-poketrack}
      # Signs the 30-day bearer tokens in backend/auth.py. Without it the app
      # silently falls back to a public default secret — set it.
      JWT_SECRET: ${JWT_SECRET}
      # The SPA is same-origin, so this only needs to name the one host.
      # Leaving it at the code default of "*" would pair a wildcard origin with
      # allow_credentials=True, which browsers reject outright.
      CORS_ORIGINS: ${CORS_ORIGINS:-https://poketrack.kimnejudne.dev}
    # Loopback only — nginx terminates TLS in front and is the sole way in.
    # Never expose this port publicly.
    ports:
      - "127.0.0.1:3004:8000"
    mem_limit: 256m

volumes:
  poketrack-mongo:
