# poketrack.kimnejudne.dev
# TLS blocks are certbot-managed — leave those lines as they are.
#
# Two things live behind this host:
#   /api/  -> the FastAPI container on loopback 3004
#   /      -> the CRA build on disk at /var/www/poketrack
#
# nginx serves the bundle directly rather than proxying it through uvicorn:
# static bytes have no business waking a Python process on a shared 2GB box.

server {
    server_name poketrack.kimnejudne.dev;

    root /var/www/poketrack;
    index index.html;

    # Renewal is webroot-based against this directory. Keep it reachable.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # API responses are per-request state; never let a cache hold them.
    # PokéAPI prewarm can make a cold first request slow, hence the timeout.
    location /api/ {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        proxy_read_timeout 60s;
    }

    # CRA emits content-hashed filenames under /static/, so these are immutable.
    location /static/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The SPA entry document is rewritten on every deploy and must not be cached,
    # or a stale index.html will keep pointing at deleted asset hashes.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # Client-side routes (/teams/:id, /projects/:id, /invite/:token) have no file
    # on disk. Anything that is not a real file falls through to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/poketrack.kimnejudne.dev/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/poketrack.kimnejudne.dev/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = poketrack.kimnejudne.dev) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name poketrack.kimnejudne.dev;
    return 404; # managed by Certbot
}
