# poketrack.kimnejudne.dev
# TLS blocks are certbot-managed — leave those lines as they are.
#
# Two things live behind this host:
#   /api/  -> the FastAPI container on loopback 3004
#   /      -> the CRA build on disk at /var/www/poketrack
#
# nginx serves the bundle directly rather than proxying it through uvicorn:
# static bytes have no business waking a Python process on a shared 2GB box.

server {
    server_name poketrack.kimnejudne.dev;

    root /var/www/poketrack;
    index index.html;

    # Own log rather than the shared /var/log/nginx/access.log, so GoAccess can
    # report on this host without having to sieve four vhosts apart. logrotate's
    # /var/log/nginx/*.log rule already covers it — daily, 14 days.
    access_log /var/log/nginx/poketrack.access.log;

    # Renewal is webroot-based against this directory. Keep it reachable.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # API responses are per-request state; never let a cache hold them.
    # PokéAPI prewarm can make a cold first request slow, hence the timeout.
    # `^~` so no regex location can ever take a request away from the API.
    # nginx tests regexes before plain prefixes, and the asset rule below
    # would match any API path that happened to end in an extension.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        proxy_read_timeout 60s;
    }

    # CRA emits content-hashed filenames under /static/, so these are immutable.
    #
    # `^~` matters now that a regex location exists below: nginx tests regexes
    # before plain prefixes, so the asset rule would otherwise win here and
    # these files would lose their immutable header without anything failing.
    location ^~ /static/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # The SPA entry document is rewritten on every deploy and must not be cached,
    # or a stale index.html will keep pointing at deleted asset hashes.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    # GoAccess report, regenerated hourly by scripts/stats.sh. Declared before
    # the SPA catch-all reaches it — a prefix this specific wins over `location /`
    # regardless of order, but keeping them adjacent makes the intent readable.
    #
    # auth_basic is scoped to this one location on purpose. Applied at server
    # level it would also cover the ACME challenge path above and quietly break
    # certificate renewal.
    location ^~ /_stats/ {
        alias /var/www/poketrack-stats/;
        index index.html;
        auth_basic "PokeTrack stats";
        auth_basic_user_file /etc/nginx/poketrack-stats.htpasswd;
        add_header Cache-Control "no-store" always;
    }

    # A missing file is a 404, not the app.
    #
    # `try_files $uri $uri/ /index.html` alone answered *everything* with the SPA
    # shell at status 200 — /robots.txt, /sitemap.xml, /favicon-nope.png, any
    # typo at all. No 404 existed anywhere on this site, which lets a crawler
    # index unlimited duplicate URLs and makes a missing asset look like a
    # working page to anything that checks a status code rather than a body.
    # This is the same defect PLINTH's craft pass found and fixed; it was never
    # carried across.
    #
    # Anything that looks like a file is served if it exists and refused if it
    # does not. Extensionless paths are still routes and still reach the app.
    location ~* \.(?:avif|css|gif|ico|jpe?g|js|json|map|mp4|pdf|png|svg|txt|webmanifest|webp|woff2?|xml)$ {
        try_files $uri =404;
    }

    # The real client-side route trees, from `frontend/src/App.js`. These have no
    # file on disk and must reach the shell at **200** — they are working pages,
    # and `/invite/:token` in particular is a link people are sent.
    #
    # Listing them here duplicates the router, and nginx cannot import it, so
    # this can drift: a route added to the app and not to this line will answer
    # 404 while rendering perfectly in the browser. That is a soft, visible
    # failure, and it is the price of the block below being able to say no.
    location ~ ^/(sign-in|sign-up|invite|teams|projects)(/|$) {
        try_files $uri $uri/ /index.html;
    }

    # Everything else: not a file, not a route, so a 404 — with the shell as the
    # body, so a visitor gets the site's own not-found screen rather than nginx's.
    #
    # `error_page 404 =404 /index.html` is what buys that: try_files refuses the
    # path, the handler serves the shell, and `=404` keeps the status rather than
    # rewriting it to 200 the way a bare `error_page` would. Scoped to this block
    # so a missing asset above still gets a plain 404 instead of a page of HTML.
    #
    # `/` still resolves here: try_files falls to `$uri/`, which the `index`
    # directive turns into /index.html at 200.
    location / {
        try_files $uri $uri/ =404;
        error_page 404 =404 /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/poketrack.kimnejudne.dev/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/poketrack.kimnejudne.dev/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = poketrack.kimnejudne.dev) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name poketrack.kimnejudne.dev;
    return 404; # managed by Certbot
}
