<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="PokéTrack">
  <!-- Palette and proportions match the in-app ball in src/components/game/
       PokeBallLoader.js and the TopBar brand mark. Deliberately chunky: the
       band and the button have to survive being drawn at 16px. -->
  <defs>
    <clipPath id="ball">
      <circle cx="16" cy="16" r="16"/>
    </clipPath>
  </defs>
  <g clip-path="url(#ball)">
    <rect width="32" height="16" fill="#E53935"/>
    <rect y="16" width="32" height="16" fill="#F7F7FB"/>
    <rect y="13.4" width="32" height="5.2" fill="#0B0B0F"/>
  </g>
  <!-- r + half the stroke lands exactly on 16, so the outline never clips. -->
  <circle cx="16" cy="16" r="14.7" fill="none" stroke="#0B0B0F" stroke-width="2.6"/>
  <circle cx="16" cy="16" r="5.6" fill="#0B0B0F"/>
  <circle cx="16" cy="16" r="3.4" fill="#F7F7FB"/>
</svg>
