<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#070A12" />
        <meta name="description" content="PokéTrack — a team task tracker where completing tickets levels up your Pokémon." />
        <!-- .ico first as the floor (Safari <16, older Edge); browsers that
             understand the SVG prefer it and stay crisp at any density. -->
        <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="32x32" />
        <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
        <!-- Fonts are self-hosted; see the @fontsource imports in src/index.js. -->
        <title>PokéTrack — Level up your team.</title>
        <link rel="canonical" href="https://poketrack.kimnejudne.dev/" />

        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="PokéTrack" />
        <meta property="og:url" content="https://poketrack.kimnejudne.dev/" />
        <meta property="og:title" content="PokéTrack — Level up your team." />
        <meta
            property="og:description"
            content="A team task tracker where completing tickets levels up your Pokémon. Real PokéAPI growth curves, and un-doing the work de-evolves it."
        />

        <!-- Absolute rather than %PUBLIC_URL%: CRA would resolve that to a
             root-relative path, and several scrapers resolve og:image against
             nothing at all and drop a relative one.

             There were no Open Graph tags here at all until 2026-08-06, so
             every paste of this link rendered as a bare grey rectangle. The
             card is generated by `scripts/brand.sh` through headless chromium;
             it draws its own XP bar rather than screenshotting the app, because
             the sprites come from PokéAPI at runtime and a card that needs a
             third-party fetch is a card that eventually renders empty. -->
        <meta property="og:image" content="https://poketrack.kimnejudne.dev/og-card.png" />
        <meta property="og:image:type" content="image/png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta
            property="og:image:alt"
            content="A dark navy screen in a pixel typeface reading Level up your team, with an XP bar for a Charmeleon at level 27 and a Game Boy dialogue box reading: state is never stored, it is the sum of the ledger, every read."
        />
        <meta name="twitter:card" content="summary_large_image" />
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
    </body>
</html>
