# sketchy.kimnejudne.dev
# Installed at /etc/nginx/sites-available/sketchy (bootstrap, 2026-10-30; README, Deploy).
#
# Everything goes to the one Node container on loopback 3006: the built client, the HTTP API
# and both Socket.IO namespaces (the main one and /ink share the one WebSocket at /socket.io/).
# Node serves the client itself, so there is no bundle on disk here.

# `Connection: upgrade` only when the client asked for one; plain requests keep keep-alive.
map $http_upgrade $sketchy_connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    # The droplet runs nginx 1.24, which predates the separate `http2 on;` directive.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sketchy.kimnejudne.dev;

    ssl_certificate /etc/letsencrypt/live/sketchy.kimnejudne.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sketchy.kimnejudne.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Own log, so this host can be read apart from the other vhosts.
    access_log /var/log/nginx/sketchy.access.log;

    # Room creation and every other HTTP body are small; drawings travel over the WebSocket.
    client_max_body_size 256k;

    # Every Screen and phone holds one WebSocket here for the whole game, carrying both
    # namespaces. Without the upgrade headers every client falls back to long-polling (F39),
    # which works but adds latency to guesses and ink, so keep them. No upstream keepalive: the
    # deploy counts established connections to 127.0.0.1:3006 as live games (a phone on the
    # polling fallback holds one only while a poll is open). Socket.IO pings every 5 s, so a 120 s read
    # timeout never closes a live socket but does reap a dead one.
    location ^~ /socket.io/ {
        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $sketchy_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # TRUST_PROXY=1 takes the right-most entry, which is the one nginx appends.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    # nginx's default level 1 sends the player page's JS at about 134 KB; level 6 keeps it inside
    # the 120 KB join budget that `npm run size` and scripts/bundle.test.ts measure (F39).
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}

server {
    listen 80;
    listen [::]:80;
    server_name sketchy.kimnejudne.dev;

    # Renewal is webroot-based against this directory. Keep it reachable over plain HTTP.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
