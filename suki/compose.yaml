# Local development stack. The droplet stack lives in deploy/.
#
# Postgres is published on 5435: 5432 is the system default, 5433 belongs to
# another project on this workstation and 5434 to FORME. Nothing here may assume
# a free port, which is also why the deployed stack publishes none.
name: suki

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: suki
      POSTGRES_PASSWORD: suki
      POSTGRES_DB: suki
    ports:
      - '127.0.0.1:5435:5432'
    volumes:
      - suki-db:/var/lib/postgresql/data
    command:
      - postgres
      # Tuned for a shared 1.9GB box rather than left at defaults, so the
      # development stack behaves like the deployed one.
      - -c
      - shared_buffers=32MB
      - -c
      - effective_cache_size=96MB
      - -c
      - work_mem=2MB
      - -c
      - max_connections=20
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U suki -d suki']
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 160m

volumes:
  suki-db:
