# suki.kimnejudne.dev
# TLS blocks are certbot-managed — leave those lines as they are.
#
# Two things live behind this name: a static PWA served off disk, and the sync
# API proxied to the compose stack on 127.0.0.1:3007. They share an origin
# deliberately — a service worker can only control pages on its own origin, and
# putting the API elsewhere would mean CORS preflights on the one request path
# that runs on a phone with one bar of signal.
#
# The caching rules below are the load-bearing part of this file. A PWA that
# caches its own service worker wrong cannot be updated: every visitor keeps
# running the version they first installed, forever, and there is no way to
# reach them. Getting this wrong is not a slow site, it is a bricked deploy.

server {
    server_name suki.kimnejudne.dev;

    root /var/www/suki;
    index index.html;

    # Renewal is webroot-based against this directory. Keep it reachable.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # The sync API. Never cached anywhere: a cached push response would tell a
    # shopkeeper her sales synced when they did not.
    # `^~` so no regex location can ever take a request away from the API.
    # nginx tests regexes before plain prefixes, and the asset rule below
    # would match any API path that happened to end in an extension.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3007;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;

        # A phone back from a week offline pushes a large batch over a slow
        # link. The default 60s is enough, but say so rather than inherit it.
        proxy_read_timeout 60s;
        client_max_body_size 2m;
    }

    # Vite emits content-hashed filenames under /assets/, so these are immutable
    # by construction — a changed file gets a changed name. `^~` because the
    # regex locations below would otherwise win: nginx tests regexes before
    # plain prefixes, and the hashed .woff2 files live in here too.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # The service worker and its registration shim. These filenames never
    # change, so a long max-age here is permanent: browsers would keep serving
    # the old worker, which keeps serving the old precache manifest, and the
    # site could never be updated again.
    #
    # Chrome caps sw.js at 24h regardless, but "the browser will probably save
    # us" is not a deployment strategy.
    location ~ ^/(sw\.js|registerSW\.js|workbox-[^/]+\.js)$ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Rewritten on every deploy: the manifest names the current asset hashes,
    # and a stale copy points at files that were deleted.
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
        types { } default_type "application/manifest+json";
        try_files $uri =404;
    }

    # SPA fallback. Every route is client-side, so anything not on disk is
    # index.html — which must also not be cached, for the same reason as the
    # manifest.
    #
    # But only for *routes*. `try_files $uri $uri/ /index.html` on its own
    # answered everything with the shell at status 200 — /robots.txt,
    # /sitemap.xml, a mistyped icon — so no 404 existed anywhere on this site.
    # A crawler can index unlimited duplicate URLs off that, and anything
    # checking a status code rather than a body reads a missing file as present.
    # PLINTH's craft pass found and fixed this; it was never carried across.
    #
    # `error_page 404 =404 /index.html` is what keeps routes working while the
    # status stays honest: try_files refuses the path, the handler serves the
    # shell, and `=404` preserves the code rather than rewriting it to 200 the
    # way a bare `error_page` would. `NotFoundPage` renders and the crawler is
    # told the truth. Scoped to this block, so the asset rule below still
    # answers a missing file with a plain 404 instead of a page of HTML.
    # The real client-side route trees, from `src/App.tsx`. These have no file on
    # disk and must reach the shell at **200** — they are the app.
    #
    # Listing them here duplicates the router, and nginx cannot import it, so
    # this can drift: a route added to the app and not to this line will answer
    # 404 while rendering perfectly in the browser. That is a soft, visible
    # failure, and it is the price of the block below being able to say no.
    location ~ ^/(till|cart|lista|stock|day|restock|settings|unlock)(/|$) {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # Everything else: not a file, not a route, so a 404 — with the shell as the
    # body, so `NotFoundPage` renders rather than nginx's default.
    #
    # `/` still resolves here: try_files falls to `$uri/`, which the `index`
    # directive turns into /index.html at 200.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
        error_page 404 =404 /index.html;
    }


    # Icons from public/ — the app icon, the maskable variant, the favicon —
    # and the share card.
    #
    # These are NOT content-hashed, so `immutable` would be a promise the build
    # cannot keep: redrawing the mark would leave every installed phone showing
    # the old one with no way to correct it. A day is long enough to be free
    # and short enough to be fixable.
    #
    # `og-card.png` is here for the same reason and not in `/assets/` for the
    # same reason: a scraper that cached an immutable card would keep serving it
    # after the card was redrawn, and there would be no URL to change. It would
    # otherwise fall through to `location /` and be fetched `no-cache` every
    # time, which is safe but pointless for an image that changes twice a year.
    location ~* ^/(icon[^/]*|og-card)\.(png|svg)$ {
        add_header Cache-Control "public, max-age=86400" always;
        access_log off;
        try_files $uri =404;
    }

    # Everything else that looks like a file: served if it exists, refused if it
    # does not, so a missing asset is a plain 404 rather than a page of HTML.
    #
    # **Last of the regex locations on purpose.** nginx takes the first regex
    # that matches, so this has to sit below the service-worker and icon rules
    # or it would swallow them and they would silently lose their cache headers
    # — nothing would fail, the site would just start caching wrong. `/assets/`
    # is `^~` and beats every regex here regardless of order.
    location ~* \.(?:avif|css|gif|ico|jpe?g|js|json|map|pdf|png|svg|txt|webp|woff2?|xml)$ {
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    listen 80;
}
