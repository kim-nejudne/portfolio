<!doctype html>
<html lang="en-PH">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FBF8F0" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>SUKI — sari-sari ledger</title>
    <meta
      name="description"
      content="Lista, tingi stock and the day’s takings for a sari-sari store. Works with no signal."
    />
    <meta property="og:title" content="SUKI — sari-sari ledger" />
    <meta
      property="og:description"
      content="Lista, tingi stock and the day’s takings for a sari-sari store. Works with no signal."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SUKI" />
    <meta property="og:url" content="https://suki.kimnejudne.dev/" />

    <!-- Absolute, not root-relative: several scrapers resolve og:image against
         nothing at all and drop a relative one.

         This page declared `summary_large_image` below with no image above it
         for as long as it has existed, which is worse than declaring nothing —
         a named large-image layout with an empty slot renders as a broken box
         rather than as a plain link.

         The card is generated by `scripts/brand.mjs`, and the ledger on it is
         derived by the same `withRunningBalance` the till runs, so it cannot
         quietly disagree with the app about what Aling Bebang owes. Regenerate
         it when the specimen or the arithmetic changes; nothing here will tell
         you it has gone stale. It sits at the site root, outside the
         content-hashed `/assets/` path that nginx serves `immutable`. -->
    <meta property="og:image" content="https://suki.kimnejudne.dev/og-card.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A page of a sari-sari store's credit book: four ruled rows of utang and bayad for Aling Bebang Ramirez, with the running balance down the right-hand side, ending at ₱332."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
