# Droplet stack. Lives at /opt/tallow/compose.yaml alongside a .env holding secrets.
#
# The image is built on a workstation and shipped with `docker save | docker load`,
# so there is no build context here — the 1vCPU box should not be running npm ci.
#
#   docker compose up -d
#
# Tallow shares a 1.9GB box with n8n, netint-vpuaas, poketrack (and marrow).
# Every service is capped so a leak here cannot take the others down.

name: tallow

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Deliberately no `ports:`. Postgres is reachable only on the private
    # compose network — it has no path to the internet at all.
    volumes:
      - tallow-db:/var/lib/postgresql/data
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - effective_cache_size=96MB
      - -c
      - maintenance_work_mem=24MB
      - -c
      - work_mem=2MB
      - -c
      - max_connections=20
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 192m

  # Applies schema and seeds on first run, then exits. The app waits for it.
  migrate:
    image: tallow:${IMAGE_TAG:-local}
    restart: "no"
    command: ["node", "dist-server/migrate.cjs"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    mem_limit: 192m

  app:
    image: tallow:${IMAGE_TAG:-local}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      MAX_SLOT_COVERS: ${MAX_SLOT_COVERS:-16}
      # Signs admin sessions. The app refuses to boot without it.
      SESSION_SECRET: ${SESSION_SECRET}
      # Full-access PIN, private.
      STAFF_PIN: ${STAFF_PIN}
      # Read-only PIN, advertised on the sign-in screen. Omit to disable the demo role.
      DEMO_PIN: ${DEMO_PIN:-}
    # Loopback only — nginx terminates TLS and applies basic auth in front.
    # Never expose this port publicly.
    ports:
      - "127.0.0.1:3003:3000"
    mem_limit: 256m

volumes:
  tallow-db:
