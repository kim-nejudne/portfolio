# tallow.kimnejudne.dev
# TLS blocks are certbot-managed once DNS resolves — leave those lines as they are.
#
# The whole vhost sits behind HTTP basic auth. This is load-bearing, not cosmetic:
# tallow's six /api/admin/* routes do not check the session token they hand out,
# so anything reachable here can read guest reservations and edit the menu.
# Do not remove `auth_basic` until those routes enforce auth themselves.

server {
    server_name tallow.kimnejudne.dev;

    auth_basic           "TALLOW — private preview";
    auth_basic_user_file /etc/nginx/.htpasswd-tallow;

    # ACME http-01 validation must stay reachable, or certbot gets a 401 from
    # the basic auth above and issuance/renewal fails. This exposes only the
    # challenge tokens certbot writes into the webroot — nothing of the app.
    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Vite emits content-hashed filenames under /assets/, so these are immutable.
    location /assets/ {
        proxy_pass http://127.0.0.1:3003;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # The SPA entry document is rewritten on every deploy and must not be cached,
    # or a stale index.html will keep pointing at deleted asset hashes.
    location = / {
        proxy_pass http://127.0.0.1:3003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache" always;
    }

    # API responses are per-request state; never let a cache hold them.
    location /api/ {
        proxy_pass http://127.0.0.1:3003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 2m;

    listen 80;
    listen [::]:80;
}
