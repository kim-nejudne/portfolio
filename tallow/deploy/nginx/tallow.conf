# tallow.kimnejudne.dev
# TLS blocks are certbot-managed — leave those lines as they are.
#
# The site is intentionally public: it is a portfolio piece and recruiters must
# reach it without a password. The /api/admin/* routes are no longer protected
# here — they enforce their own bearer sessions in src/server/auth.ts, where a
# `demo` role may read the dashboard and only a `staff` role may write.
# Do not reintroduce a blanket auth_basic without also removing it from the
# ACME location below, or renewal will start failing.

server {
    server_name tallow.kimnejudne.dev;

    # Renewal is webroot-based against this directory. Keep it reachable.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Vite emits content-hashed filenames under /assets/, so these are immutable.
    location /assets/ {
        proxy_pass http://127.0.0.1:3003;
        proxy_set_header Host $host;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # The SPA entry document is rewritten on every deploy and must not be cached,
    # or a stale index.html will keep pointing at deleted asset hashes.
    location = / {
        proxy_pass http://127.0.0.1:3003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache" always;
    }

    # API responses are per-request state; never let a cache hold them.
    location /api/ {
        proxy_pass http://127.0.0.1:3003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 2m;

    listen 80;
    listen [::]:80;
}
