<!doctype html>
<html lang="en" class="bg-[#F7F4EE] text-[#1A1715]">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TALLOW — Dry-Aged, Live-Fire Steakhouse</title>
    <meta name="description" content="TALLOW, Soho. Whole primals aged 45 to 60 days in a Himalayan salt room, seared over red oak embers. Reserve a sitting." />
    <!-- Fonts are self-hosted and bundled from src/index.css: no third-party
         origin, no render-blocking stylesheet on the critical path. -->

    <link rel="canonical" href="https://tallow.kimnejudne.dev/" />
    <meta name="theme-color" content="#F7F4EE" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TALLOW" />
    <meta property="og:url" content="https://tallow.kimnejudne.dev/" />
    <meta property="og:title" content="TALLOW — Dry-Aged, Live-Fire Steakhouse" />
    <meta
      property="og:description"
      content="TALLOW, Soho. Whole primals aged 45 to 60 days in a Himalayan salt room, seared over red oak embers. Reserve a sitting."
    />

    <!-- Absolute, not root-relative: several scrapers resolve og:image against
         nothing at all and drop a relative one.

         There was no card here at all until 2026-08-06 — the head carried a
         title and a description and stopped, so every paste of this link
         rendered as a bare grey rectangle. It is generated by `scripts/brand.sh`
         through headless chromium from `scripts/brand/og-card.html`, set in the
         app's own four faces off the same woff2 files the page loads, and it
         shows the 86 board because that is the thing worth seeing. Regenerate it
         when the type or the palette moves; nothing here will tell you it has
         gone stale. -->
    <meta property="og:image" content="https://tallow.kimnejudne.dev/og-card.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A printed steakhouse menu on cream paper. Three cuts with ageing days and prices; the middle one, Bone-in Sirloin, is struck through in oxblood and stamped 86."
    />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body class="bg-[#F7F4EE] text-[#1A1715] antialiased selection:bg-[#7A2322] selection:text-[#F7F4EE]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
