id: m03-unions/03-narrowing/04-show-the-cell
kind: implement
title: Show the cell
minutes: 4
challenge: false
prompt: |
  A spreadsheet cell holds a string, a number, a boolean, a `Date`, `null` (cleared) or
  `undefined` (never filled). Implement two functions in `index.ts`:

  - `showCell(cell, decimals)` returns the text for one cell: `''` for `null` and `undefined`;
    a string trimmed; a number with `decimals` decimals, `2` when not given; a boolean as
    `'yes'` or `'no'`; a `Date` as its day, the first ten characters of `toISOString()`, such as
    `'2026-10-21'`.
  - `showRow(row, decimals)` shows every cell of a `readonly` row with the same `decimals`, also
    `2` when not given, and joins them with `' | '`.

  This combines the lesson with `null` and `undefined` (3.2), default parameters (2.1),
  callbacks (2.2) and readonly arrays (1.3).
entry: index.ts
tests: tests.ts
compilerOptions: {}
libs: [es2025]
forbid: [explicit-any, as-unknown-as, non-null-assertion]
hints:
  - '`0` and `false` are values here, not empty cells, so the first check must be true for `null` and `undefined` and for nothing else.'
  - Three of the remaining members are primitives that `typeof` tells apart. Once they are handled, only one member is left for the last branch.
  - '`showRow` shows each cell with `showCell` and the same `decimals`. Remember what else an array method passes to its callback (2.2).'
