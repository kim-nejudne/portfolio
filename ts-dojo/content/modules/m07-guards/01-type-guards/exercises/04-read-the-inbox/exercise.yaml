id: m07-guards/01-type-guards/04-read-the-inbox
kind: implement
title: Read the inbox
minutes: 5
challenge: false
prompt: |
  A chat server sends the inbox as a JSON array, and some of its entries come from older
  clients with the wrong shape. `Message` in `index.ts` is a discriminated union of three
  kinds, told apart by `type`. Implement:

  - `isMessage(value)`, a type guard for `Message`. It returns `true` when `value` is an object
    with a `from` that is a string and a `type` that is `'text'`, `'image'` or `'leave'`, and
    with the properties that kind needs: a string `body` for `'text'`, a string `url` and a
    number `width` for `'image'`, nothing more for `'leave'`. Extra properties are fine.
  - `readInbox(json)`, which parses the text and returns the entries that are messages, in
    their order. When the data isn't an array, it returns an empty array. The text is always
    valid JSON.

  This combines the lesson with discriminated unions (3.5), narrowing with `typeof`, `in` and
  equality (3.3) and early returns (3.4).
entry: index.ts
tests: tests.ts
compilerOptions: {}
libs: [es2025]
forbid: [explicit-any, as-unknown-as, non-null-assertion, angle-cast]
hints:
  - Check what every kind shares first, an object with a string `from` and some `type`, and return early when that fails.
  - A `switch` on the `type` property can then check the properties of each kind, with a `default` for every other value.
  - For `readInbox`, `Array.isArray` rules out data that isn't a list, and a guard can decide which entries to keep.
