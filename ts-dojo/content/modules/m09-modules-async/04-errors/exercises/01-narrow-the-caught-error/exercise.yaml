id: m09-modules-async/04-errors/01-narrow-the-caught-error
kind: fix
title: Narrow the caught error
minutes: 2
challenge: false
prompt: |
  `report` in `index.ts` runs a request and describes how it went, and it doesn't compile:

  - `Catch clause variable type annotation must be 'any' or 'unknown' if specified.`

  Make it compile, and make it describe every outcome correctly:

  - when `request` returns, `'ok: '` and what it returned;
  - when it throws an `HttpError`, `'HTTP '`, the status, `': '` and the message, such as
    `'HTTP 404: no such page'`;
  - when it throws any other `Error`, `'failed: '` and the message;
  - when it throws anything else, `'failed: '` and `String(value)`. Only instances of
    `Error` count as errors, even if a plain object has a `message` or a `status`.

  The tests throw `HttpError`s, other errors, strings, numbers and plain objects.
entry: index.ts
tests: tests.ts
compilerOptions: {}
libs: [es2025]
forbid: [explicit-any, as-unknown-as, non-null-assertion, angle-cast]
hints:
  - A catch clause accepts only two annotations, and neither tells you what was thrown. Leave the annotation out and find out instead.
  - instanceof narrows to a class. An HttpError is also an Error, so the order of the checks matters.
