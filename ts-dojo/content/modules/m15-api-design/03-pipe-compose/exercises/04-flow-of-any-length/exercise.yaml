hints:
  - Give `first` its own type parameter, so that `Parameters` and `ReturnType` can read it, and infer the rest as one tuple.
  - The lesson's `Lined` checks a tuple of functions against a starting type. What is the starting type here?
  - The public signature can be generic while the implementation signature below it takes and returns `unknown`.
