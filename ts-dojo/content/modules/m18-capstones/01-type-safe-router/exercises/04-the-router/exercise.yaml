hints:
  - Make `createRouter` generic in the whole table, constrained to an object of routes that return strings. The names are its keys; a `for...in` loop gives them as strings.
  - '`href` and `navigate` are generic in the route name, and the pattern is an indexed access type on the table. If `.path` read through a generic name comes out as plain `string`, what could the place you put it expect instead?'
  - In `respond`, the `never` check goes in the `default` branch of the `switch`, after one `case` for each kind.
