id: m99-fixtures/03-type-challenge/01-describe-the-events
kind: type-challenge
title: Describe the events
minutes: 5
challenge: false
prompt: |
  Define `UIEvent` as a discriminated union of three events. Each has a `type` property that
  tells them apart:

  - `click` with `x` and `y`, both `number`
  - `keydown` with `key`, a `string`
  - `scroll` with `deltaY`, a `number`

  The type cases check that the union is exactly these three members and that an object with
  the wrong properties for its `type` is rejected.
entry: index.ts
tests: tests.ts
compilerOptions: {}
libs: [es2025]
forbid: [explicit-any]
timeoutMs: 5000
hints:
  - Each member is an object type whose `type` property has a string literal type, not `string`.
  - Join the three object types with `|`, using exactly the property names the prompt lists.
