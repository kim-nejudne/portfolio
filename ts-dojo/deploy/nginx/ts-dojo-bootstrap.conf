# dojo.kimnejudne.dev — bootstrap vhost, HTTP only (spec §10 First deploy, step 2).
#
# Written from the hub's hub-bootstrap.conf. It solves a chicken-and-egg: ts-dojo.conf names
# /etc/letsencrypt/live/dojo.kimnejudne.dev/, so `nginx -t` fails and nginx will not reload until
# the certificate exists, and certbot cannot issue the certificate until nginx answers on port 80
# for the name.
#
# So this goes in first, keeps the ACME challenge path reachable and serves the site over plain
# HTTP, and is replaced by ts-dojo.conf once the certificate is in hand. It is not the shipped
# configuration and must never be left installed: no TLS, no redirect, no headers.
#
#   scp deploy/nginx/ts-dojo-bootstrap.conf $TS_DOJO_HOST:/etc/nginx/sites-available/ts-dojo
#   ssh $TS_DOJO_HOST 'ln -sf /etc/nginx/sites-available/ts-dojo /etc/nginx/sites-enabled/ts-dojo && nginx -t && systemctl reload nginx'
#   ssh $TS_DOJO_HOST 'certbot certonly --webroot -w /var/www/certbot -d dojo.kimnejudne.dev'
#   # then install ts-dojo.conf over it and reload (deploy/README.md, DNS/TLS)

server {
    listen 80;
    listen [::]:80;
    server_name dojo.kimnejudne.dev;

    root /var/www/ts-dojo;
    index index.html;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        try_files $uri /index.html;
    }
}
