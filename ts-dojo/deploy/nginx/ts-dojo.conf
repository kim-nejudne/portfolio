# dojo.kimnejudne.dev — ts-dojo.
# Lives at /etc/nginx/sites-available/ts-dojo, symlinked into sites-enabled.
#
# Written from plinth.conf and the hub's TLS blocks (spec §10). After the first install, copy
# the installed file back over this one so the two cannot drift. deploy.sh does not touch it;
# it only reloads. vite.config.ts reads the CSP from this file for `vite preview`, so the
# Playwright runs happen under exactly the shipped policy.
#
# ts-dojo is a static build with no server process: nginx serves the files from disk.
#
# NOTE ON add_header: nginx does NOT merge add_header across levels. A location block with any
# add_header discards every one inherited from the server block, so the security headers and
# the CSP are repeated in each location rather than set once at server level, where they would
# silently apply to nothing.
#
# The CSP (§10) lets the sandbox load the user's modules from blob: URLs and start its worker,
# and nothing else load from anywhere but this origin.

server {
    server_name dojo.kimnejudne.dev;

    root /var/www/ts-dojo;
    index index.html;

    # Renewal is webroot-based against this directory. Keep it reachable.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # Vite emits content-hashed filenames under /assets/ (the app, both worker chunks, the
    # lesson chunks, the fonts), so these are immutable. A missing hash is a 404, never the
    # document: a stale index.html must fail loudly, not load HTML as a script.
    location /assets/ {
        try_files $uri =404;
        access_log off;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' blob:; worker-src 'self' blob:; connect-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'" always;
    }

    # TypeScript's lib.*.d.ts files, fetched by the ts-ls worker. nginx's mime.types maps .ts to
    # video/mp2t; the worker reads them as text either way, but the right type keeps gzip_types
    # and any proxy honest. The directory is versioned (/ts/6.0.3/), so a year is safe.
    location /ts/ {
        types { text/plain ts; }
        try_files $uri =404;
        access_log off;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' blob:; worker-src 'self' blob:; connect-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'" always;
    }

    # nginx's default mime.types has no entry for .webmanifest, so it falls back to
    # application/octet-stream, which browsers refuse to parse as a manifest.
    location = /manifest.webmanifest {
        types { } default_type application/manifest+json;

        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' blob:; worker-src 'self' blob:; connect-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'" always;
    }

    # The icon, as plinth's brand assets: at the root and NOT content-hashed (index.html and the
    # manifest name it by URL), so a day, long enough to be worth having and short enough that a
    # new icon lands without a cache-buster. The service worker precaches it as well.
    location = /favicon.svg {
        access_log off;

        add_header Cache-Control "public, max-age=86400" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' blob:; worker-src 'self' blob:; connect-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'" always;
    }

    # Everything else: index.html, sw.js, workbox-*.js and the SPA routes. The app has a
    # client-side router, so /l/<lesson>, /m/<module>, /repl, /settings and /progress all
    # answer with index.html. The entry document and the service worker are rewritten on
    # every deploy and must not be cached: a stale index.html points at deleted asset
    # hashes, and a stale sw.js would keep serving the old precache.
    location / {
        try_files $uri /index.html;

        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' blob:; worker-src 'self' blob:; connect-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'" always;
    }

    # Assets are precompressed at deploy time with gzip -9 (js, css, html, svg, json, d.ts);
    # serve those rather than burning the single vCPU recompressing per request. The worker
    # chunk is the big one: about 3.6 MB raw.
    gzip_static on;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    client_max_body_size 1m;

    # No `http2`: on this nginx it is a parameter of `listen`, which binds the socket for every
    # vhost on the box, so turning it on is a box-wide decision (see the hub's deploy README),
    # not a side effect of deploying one site.
    listen 443 ssl;
    listen [::]:443 ssl;
    ssl_certificate /etc/letsencrypt/live/dojo.kimnejudne.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dojo.kimnejudne.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# Plain HTTP: the ACME challenge stays reachable on port 80 (that is how renewal works),
# everything else goes to HTTPS.
server {
    server_name dojo.kimnejudne.dev;

    listen 80;
    listen [::]:80;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://dojo.kimnejudne.dev$request_uri;
    }
}
