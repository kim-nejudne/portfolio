id: m99-fixtures/02-implement/01-largest-shape
kind: implement
title: The largest shape
minutes: 6
challenge: false
prompt: |
  Implement two functions over the `Shape` union in `index.ts`:

  - `area(shape)` returns the area of one shape. Handle every kind, and prove it with a `never`
    check in the `default` branch.
  - `largest(shapes)` returns the shape with the largest area, or `undefined` when the list is
    empty. The list is `readonly`.
entry: index.ts
tests: tests.ts
compilerOptions: {}
libs: [es2025]
forbid: [explicit-any, non-null-assertion]
timeoutMs: 5000
hints:
  - 'Start with `area`: a `switch` on `shape.kind` with one `case` per kind, and a `default` that assigns `shape` to a variable of type `never`.'
  - For `largest`, keep the best shape so far in a variable typed `Shape | undefined` that starts as `undefined`.
  - When `best` is `undefined` there is nothing to compare, so the first shape is taken; after that compare `area(shape) > area(best)`.
